name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The store rejects an upload whose version is not higher than the last one, so
      # the tag is the single source of the version the zips carry.
      - name: Take the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "tag $GITHUB_REF_NAME is not a valid extension version" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v' package.json > package.json.next
          mv package.json.next package.json
      - run: bun run test
      - run: bun run zip
      - run: bun run zip:firefox
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
